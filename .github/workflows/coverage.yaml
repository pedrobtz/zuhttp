on:
  push:
    branches: [main]
  pull_request:

name: coverage.yaml

# The reusable workflow commits .github/badges/coverage.svg back to the branch
# on a push, so the caller has to grant write. It guards that step with
# `if: github.event_name == 'push'` itself, so a pull request gets the job
# summary and commits nothing.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every pull request runs this, from a fork or from a branch here (W1); the
  # badge is committed only on a push to main, by the reusable workflow.
  #
  # WHAT THIS NUMBER MEANS, because it is lower than the suite deserves and
  # the gap is structural rather than a gap in testing:
  #
  #   covr instruments the package and runs the R tests. It therefore sees
  #   src/ compiled into the R package, but NOT the two suites that actually
  #   exercise the C core — ctest's 1500 offline checks against a mock stream,
  #   and the nine fuzz targets. src/ carries about 6000 of roughly 7000
  #   expressions, so the C figure sets the headline almost by itself.
  #
  #   Read it as "how much of the C core the R suite reaches", which is a real
  #   question, and not as this package's test coverage. c-core.yaml and
  #   fuzz.yaml are where the rest lives.
  #
  #   TWO THINGS MOVE IT, so compare like with like before reading a change as
  #   progress or regression:
  #
  #   * The backend. This job runs on Linux and so compiles zu_tls_openssl.c;
  #     a macOS run compiles zu_tls_sectransport.c instead. Same suite,
  #     different denominator — 54.2% here against 46.3% measured on macOS.
  #   * NOT_CRAN. covr itself never sets it, but the r-actions job does
  #     (`NOT_CRAN: true` in its log), so the loopback
  #     tests -- proxy, download, the origin-backed trace and redact arms --
  #     run here and count. A local `covr::package_coverage()` without it
  #     skips them, and reads about 13 points lower on macOS.
  #   * Child processes. A test whose webfakes app captures the zuhttp
  #     namespace makes the server process load the instrumented package, and
  #     stopping it can truncate its trace file: `readRDS(f)` then fails the
  #     whole run (W1). Build such apps in an environment parented on
  #     globalenv(), as test-retry.R does.
  #     The same goes for mclapply() children, which write their own trace as
  #     they exit: the tests pass mc.cleanup = FALSE so the parent does not
  #     SIGTERM them while they do.
  coverage:
    # A commit, not the floating tag: this job holds `contents: write`, so a
    # moved tag in another repository could commit to this one. The same
    # commit every family repo pins coverage.yml to.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@59c917ddee2cd0191f8f015016c4c76c4f2a8c87 # v1.18.0
    permissions:
      contents: write
