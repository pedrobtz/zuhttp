# Checks on the compiled package that R CMD check does not perform, from
# pedrobtz/r-actions (roadmap W1, #18).
#
# c-core.yaml and fuzz.yaml already put the C core under ASan, UBSan and
# valgrind -- but as ctest and fuzz binaries, with no R in the process. What
# they cannot reach is src/init.c, the R glue: the only file that touches the
# PROTECT stack, R_CheckUserInterrupt() and external-pointer finalizers. The
# S8 `R_FindNamespace` PROTECT bug in it was found by reading. These jobs run
# the package as R loads it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: native-checks.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the four workflows it changes: quick skips the asan
# containers, valgrind and cran-special, and runs gctorture at step 500
# instead of 20. lto, rchk and analyzers take minutes either way and run on
# every push.
jobs:
  # ci.md: a documentation-only pull request skips the jobs below. The gate
  # is r-actions' changes.yml, as in fuzz.yaml; assurance.yml reports a job
  # that is not wired to it.
  changes:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: native-checks

  # UBSan under clang and gcc with CRAN's flags; ASan in the R-hub containers,
  # whose R is itself instrumented. ASan is the one that matters most for the
  # glue: an interrupt longjmps out of the engine, and what it skips past is
  # sockets and TLS contexts that only a finalizer gets back (§25).
  sanitizers:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:sanitizers'))
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      # NOT_CRAN: without it every skip_on_cran() test, which is the whole
      # loopback suite (the TLS matrix, the raw servers, the proxy, the
      # pulled bodies), skipped under ASan as "On CRAN" (review #186). The
      # valgrind workflow takes no env input; its glue coverage is the
      # valgrind-glue job below.
      env: |
        NOT_CRAN=true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:valgrind'))
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      valgrind-opts: >-
        --leak-check=full
        --show-leak-kinds=definite,indirect
        --errors-for-leak-kinds=definite,indirect

  # -flto cross-checks each declaration against its definition in another
  # translation unit: the R glue, the engine and two vendored libraries are
  # separate compilations.
  lto:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:lto'))
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # rchk reasons statically about the PROTECT stack and reaches code no test
  # executes; gctorture provokes real collections and catches what static
  # reasoning misses. The image has no -dev packages, so configure needs
  # OpenSSL and zlib named here or it fails before anything is analysed.
  rchk:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:rchk'))
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      system-packages: libssl-dev zlib1g-dev
      fail-on-findings: true

  gctorture:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:gctorture'))
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      # Marks the run, so tests whose assertion is a wall-clock bound skip
      # themselves: gctorture makes R many times slower, and a 10 s request
      # timeout then fires mid-handshake. They test timing, not memory.
      env: |
        ZU_GCTORTURE=true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  # GCC's -fanalyzer, for allocator lifecycle on error paths, which is most of
  # the engine by volume. Vendored sources are excluded: upstream's findings
  # are not ours to fix (§48).
  analyzers:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:analyzers'))
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      exclude: src/vendor

  # CRAN's rcnst, rlibro and vnu checks. Full runs only.
  cran-special:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:cran-special'))
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  # The R glue under valgrind on every pull request, quick profile included
  # (review #164, the maintainer's decision of 2026-11-05). valgrind above
  # runs the whole suite and only on the full profile; W21's uninitialised
  # pool configuration in init.c reached main through that gap (#136). This
  # runs one script through init.c's pool, pulled-body, finalizer, callback
  # and body-function paths, about two minutes, and fails on a finding whose
  # stack passes through zuhttp.
  valgrind-glue:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    name: valgrind (R glue, init.c)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install valgrind and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y valgrind libssl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::webfakes
          needs: check

      # -O1 -g: line numbers in the stacks, and code close to what users run.
      - name: Install zuhttp with debug info
        run: |
          mkdir -p ~/.R
          printf 'CFLAGS=-g -O1\n' > ~/.R/Makevars
          R CMD INSTALL .

      - name: Run the glue under valgrind
        timeout-minutes: 15
        run: tools/ci-valgrind-glue.sh "$RUNNER_TEMP/valgrind-glue.log"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-glue-log
          path: ${{ runner.temp }}/valgrind-glue.log
          if-no-files-found: ignore
