# The vendored tree matches its manifest, from pedrobtz/r-actions (W1, #18).
#
# Two halves. tools/vendor/verify answers "is src/vendor/ byte-for-byte what was
# recorded" -- and a hand edit whose checksum was re-recorded passes that. The
# pull-request half asks the other question: did a change under src/vendor/
# come with a manifest and checksums change, which is the only way the tree
# is reproducible from upstream (§48: no local modifications).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: vendor.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ci.md: a documentation-only pull request skips the jobs below. The gate
  # is r-actions' changes.yml, as in fuzz.yaml; assurance.yml reports a job
  # that is not wired to it.
  changes:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:vendor'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: vendor

  # tools/vendor/verify, manifest.tsv and checksums.sha256 are the defaults and
  # the family layout. `paths` narrows the pull-request half to the bytes that
  # came from upstream: each src/vendor/<lib>/VENDOR, the LICENSE copies and
  # uriparser's UriConfig.h are written here, so editing their prose is not a
  # re-vendoring. The checksums still cover them; `verify` still fails until
  # they are re-recorded. Found on W2, which renamed the files they cite.
  vendor:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:vendor'))
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      paths: |
        src/vendor/picohttpparser/picohttpparser.c
        src/vendor/picohttpparser/picohttpparser.h
        src/vendor/uriparser/Uri*.c
        src/vendor/uriparser/UriCommon.h
        src/vendor/uriparser/UriIp4Base.h
        src/vendor/uriparser/UriMemory.h
        src/vendor/uriparser/UriParseBase.h
        src/vendor/uriparser/uriparser/
        src/vendor/nghttp2/*.c
        src/vendor/nghttp2/*.h
        src/vendor/nghttp2/nghttp2/

  # §48, W20: tools/update-nghttp2 rebuilds the committed tree from upstream's
  # release tarball, patches included, byte for byte. VENDOR's Retrieved date
  # is the one line that legitimately differs, so it is restored before the
  # comparison; everything else, the patched sources and the licence copy
  # included, must come out identical.
  nghttp2-reproducible:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: nghttp2 rebuilt from upstream matches the tree
    steps:
      - uses: actions/checkout@v6
      - name: Re-vendor and compare
        timeout-minutes: 10
        run: |
          tools/update-nghttp2 "$(awk -F'\t' '$1 == "nghttp2" { sub(/^v/, "", $3); print $3 }' tools/vendor/manifest.tsv)"
          git checkout -- src/vendor/nghttp2/VENDOR
          tools/vendor/record
          git status --short
          git diff --exit-code
