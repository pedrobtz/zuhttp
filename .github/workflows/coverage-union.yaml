# Coverage that counts every suite, with a floor that fails the build.
#
# coverage.yaml's badge measures one thing: how much of the C core the R
# suite reaches, with NOT_CRAN unset, so every loopback test is skipped and
# the C suite (ctest), which exercises most of the core, is not counted. That
# number is useful and misleading. This workflow measures the R suite with
# NOT_CRAN=true and merges it line by line with ctest, per OS, because each
# OS builds a different TLS backend. tools/coverage/floor.dcf holds the floors.
#
# Windows is not measured yet: covr works there, but ctest's clang coverage
# build does not under Rtools.
#
# Runs on every pull request, as every workflow here does since W1.

on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * 0"    # the full profile: the macOS leg

name: coverage-union.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:coverage-union'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1.35.0
    with:
      name: coverage-union
      profile: auto

  # Linux on every push; macOS, whose leg sat 41 minutes for a runner on
  # 2026-11-10, at the full profile only (.claude/shared/ci.md): weekly,
  # on dispatch and under full-ci.
  coverage:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    name: coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.profile == 'full' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr

      - name: clang and llvm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm zlib1g-dev

      - name: C suite coverage
        run: tools/coverage/ctest-lcov.sh ctest.lcov

      # #230: what the fuzz targets reach, on the committed corpus. Not merged
      # into the floors below: a fuzzed line ran, nothing checked it.
      - name: Fuzz reach
        run: |
          floor=$(sed -n 's/^fuzz_reach: //p' tools/coverage/floor.dcf)
          tools/coverage/fuzz-lcov.sh fuzz.lcov corpus "$floor"

      # The lists behind that number: functions no fuzzer enters, conditions
      # fuzzed one way only, and lines only ctest reaches. The per-file table
      # and the function list also go to the job summary; the full report is
      # an artifact. It never fails: the floor above is the gate.
      - name: Fuzz gaps
        run: |
          set -o pipefail
          tools/coverage/fuzz-gaps.sh fuzz.lcov ctest.lcov | tee fuzz-gaps.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-gaps-${{ matrix.os }}
          path: |
            fuzz-gaps.txt
            fuzz.lcov
          retention-days: 30

      # §65.8: the HTTP/2 and gRPC servers test-http2.R drives, as
      # network.yaml starts them. The pulled body's R entry points in init.c
      # and the driver's live paths are reachable only against a server, so
      # without these the own-C figure undercounts what the suite exercises.
      # Go builds the gRPC interop server below. The Ubuntu image has it;
      # the macOS image does not (#135's first macOS run).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Start the HTTP/2 and gRPC test servers
        timeout-minutes: 8
        run: |
          python3 -m venv "$RUNNER_TEMP/h2venv"
          "$RUNNER_TEMP/h2venv/bin/pip" install --quiet hypercorn
          tools/h2-test-cert.sh "$RUNNER_TEMP/h2"
          nohup "$RUNNER_TEMP/h2venv/bin/python" tools/h2-test-server.py 18080 18443 \
            "$RUNNER_TEMP/h2/cert.pem" "$RUNNER_TEMP/h2/key.pem" \
            > "$RUNNER_TEMP/h2/server.log" 2>&1 &
          go install google.golang.org/grpc/interop/server@v1.67.1
          nohup "$(go env GOPATH)/bin/server" --port 10000 --use_tls=false \
            > "$RUNNER_TEMP/grpc-server.log" 2>&1 &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 18080 && nc -z 127.0.0.1 18443 && nc -z 127.0.0.1 10000 && break
            sleep 1
          done
          nc -z 127.0.0.1 18080 && nc -z 127.0.0.1 18443 && nc -z 127.0.0.1 10000 || {
            cat "$RUNNER_TEMP/h2/server.log" "$RUNNER_TEMP/grpc-server.log"; exit 1; }
          {
            echo "ZU_H2_TEST_SERVER=http://127.0.0.1:18080"
            echo "ZU_H2_TEST_TLS=https://localhost:18443"
            echo "ZU_H2_TEST_CA=$RUNNER_TEMP/h2/ca.pem"
            echo "ZU_GRPC_TEST_SERVER=http://127.0.0.1:10000"
          } >> "$GITHUB_ENV"

      - name: Merge with the R suite and check the floors
        run: Rscript tools/coverage/measure.R ctest.lcov
