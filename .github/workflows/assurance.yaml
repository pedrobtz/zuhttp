# Holds .agents/assurance.md to the portfolio standard
# (pedrobtz/packages claude/shared/assurance.md). Seconds; runs on every
# change, because the file it checks is Markdown the docs gate would skip.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

name: assurance

permissions:
  contents: read

jobs:
  assurance:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:assurance'))
    uses: pedrobtz/r-actions/.github/workflows/assurance.yml@v1
    # Every job here is gated (ci.md); fail keeps it so.
    with:
      ungated-jobs: fail
