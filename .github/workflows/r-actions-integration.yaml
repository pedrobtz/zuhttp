# TEMPORARY: exercises pedrobtz/r-actions PRs #59, #60 and #61 (merged on
# its test/integration branch) against a real package. Not for merging.
on:
  push:
    branches: [test/r-actions-integration]

name: r-actions-integration

permissions:
  contents: read

jobs:
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@029eaee84b4fc905ed2d8ccf54a5b880c2110ee4

  arch:
    uses: pedrobtz/r-actions/.github/workflows/arch.yml@029eaee84b4fc905ed2d8ccf54a5b880c2110ee4
    with:
      # Candidate default setups (+ libuv for fs, linux-headers for ps),
      # plus zuhttp's own libssl/zlib.
      require-tests: true
      targets: >-
        [{"name": "i386", "platform": "linux/386",
          "image": "i386/debian:bookworm",
          "setup": "apt-get update && apt-get install -y --no-install-recommends r-base-dev libuv1-dev libssl-dev zlib1g-dev"},
         {"name": "musl", "platform": "linux/amd64",
          "image": "alpine:3.21",
          "setup": "apk add --no-cache R R-dev R-doc build-base linux-headers libuv-dev openssl-dev zlib-dev"}]

  alloc-failure:
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@029eaee84b4fc905ed2d8ccf54a5b880c2110ee4
    with:
      run: Rscript -e 'library(zuhttp); invisible(zu_redact_url("https://u:p@example.com/a?token=x&b=1"))'
      baseline-run: Rscript -e 'library(zuhttp)'
      max-allocations: 200
