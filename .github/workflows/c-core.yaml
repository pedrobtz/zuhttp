# Standalone tests for the zuhttp C core (design §50.1, roadmap S2).
#
# These link no R headers, so a failure here means the core itself is broken
# rather than the R packaging. They run on all three target platforms because
# the core contains the portability layer (zu_platform.h) and the monotonic
# clock shims (zu_time.c), which are exactly the code most likely to differ.
#
# Windows compiles with the toolchain R itself uses (`R CMD config CC`), so a
# green run here means the core builds under Rtools, not merely under some gcc.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

name: c-core.yaml

permissions: read-all

jobs:
  ctest:
    runs-on: ${{ matrix.os }}
    name: C core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # Windows needs Rtools for the compiler R builds packages with.
      - uses: r-lib/actions/setup-r@v2
        if: runner.os == 'Windows'
        with:
          r-version: release

      - name: Compiler identity
        working-directory: ctest
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "using the R toolchain: $(R CMD config CC)"
            $(R CMD config CC) --version | head -2
          else
            ${CC:-cc} --version | head -2
          fi

      # -Werror with -Wconversion/-Wsign-conversion/-Wshadow/-Wvla.
      # Design §44: warnings are errors in project-owned code.
      - name: Build and run (warnings as errors)
        working-directory: ctest
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            make strict CC="$(R CMD config CC)"
          else
            make strict
          fi

      - name: ASan + UBSan
        if: runner.os != 'Windows'
        working-directory: ctest
        run: make asan

      # zuhttp vendors only part of uriparser (design §8.2). Calling into an
      # excluded module is otherwise a bare "undefined symbol" at link time;
      # this says what actually went wrong. The excluded set is a security
      # argument — six of eight historical CVEs live there — so widening it
      # is a decision, not a build fix.
      - name: No calls into non-vendored uriparser modules
        if: runner.os == 'Linux'
        run: |
          if grep -rnE 'uriNormalizeSyntax|uriMakeOwner|uriComposeQuery|uriEscape|uriUnescape|uriEqualsUri|uriRemoveBaseUri|uriUriStringToFilename|uriFilenameToUriString|uriDissectQuery' \
                 src --include='zu_*.c' --include='zu_*.h'; then
            echo "::error::the above call a uriparser module zuhttp does not vendor (src/vendor/uriparser/VENDOR)"
            exit 1
          fi
          echo "ok: no calls into excluded uriparser modules"

  # A leak or a wild write here is a release blocker (§45), so run the same
  # suite under valgrind where it is cheap to do so.
  valgrind:
    runs-on: ubuntu-latest
    name: C core (valgrind)
    steps:
      - uses: actions/checkout@v6
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run under valgrind
        working-directory: ctest
        run: |
          make zu_ctest
          valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all \
                   --errors-for-leak-kinds=definite,indirect ./zu_ctest
