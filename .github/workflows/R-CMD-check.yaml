# R CMD check, on the GitHub runners and in the CRAN-like containers, from the
# shared reusable workflow in pedrobtz/r-actions (roadmap W1, #18).
#
# r-actions calls track `@v1`, except coverage.yml: it is the one call that
# holds a repository write token, and a tag is mutable, so it stays pinned to a
# commit with the tag in a trailing comment and is bumped deliberately. The
# read-only calls follow v1 so that its fixes reach every family repo without
# a pull request in each.
#
# This replaced a hand-rolled r-lib/actions matrix. The containers are the
# reason: clang 23 building C as -std=gnu23 with -pedantic, and GCC 16, are the
# compilers of CRAN's r-devel Linux flavors, and no GitHub runner carries
# either. The ubuntu/devel row that matrix had pinned R-devel to the runner's
# own GCC, which matches no CRAN flavor.
#
# Every pull request runs this, including one from a branch of this
# repository. Until W1 every job here skipped same-repository pull requests,
# so merges went unchecked (roadmap, "Where 0.1.0 left things").
on:
  push:
    branches: [main]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on each push to a pull request, full after merge. The `full-ci`
      # label runs the full set on a pull request before merging.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

      # The default matrix plus Windows R-devel, which is CRAN's
      # r-devel-windows-x86_64 flavor -- the one win-builder exists to reach
      # (D-82: CI stands in for win-builder). It also links Schannel against
      # the newest Rtools headers, which is where W15's ABI question lives. The
      # user agent is "release" as in the r-lib template: under R-devel the
      # default one can resolve to binaries built for the wrong R.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel", "http-user-agent": "release"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]

      # CRAN's NOSUGGESTS flavor. Every Suggests here -- testthat, webfakes,
      # zuxml, zuhtml, parallel -- is used from tests and examples, and an unguarded
      # one errors on this leg and nowhere else (tests/testthat.R's guard, #18).
      nosuggests: true

      # CRAN's NOLD flavor: R built --disable-long-double, which catches
      # arithmetic that leans on 80-bit intermediates. Full profile only.
      nold: true

  # A fresh CI checkout has no stray object files, so it cannot see the failure
  # mode this guards: `R CMD INSTALL .` compiles src/ in place, and
  # `R CMD build` drops src/*.o but NOT objects in subdirectories, so the
  # vendored .o files end up in the tarball and --as-cran reports "Object
  # files/libraries should not be included in a source package".
  #
  # This reproduces the maintainer's sequence deliberately: install first, then
  # build, then assert the tarball is clean. r-actions builds from a clean
  # checkout and so cannot see it.
  source-package-hygiene:
    runs-on: ubuntu-latest
    name: Source package hygiene
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install in place, so objects are left in src/
        run: R CMD INSTALL .

      - name: Build and assert no compiled artefacts ship
        run: |
          stray=$(find src -name '*.o' | wc -l)
          echo "stray objects on disk after INSTALL: $stray"
          if [ "$stray" -eq 0 ]; then
            echo "::error::the guard is vacuous — INSTALL left no objects to catch"
            exit 1
          fi
          R CMD build .
          shipped=$(tar tzf zuhttp_*.tar.gz | grep -cE '\.(o|so|dll|a)$' || true)
          echo "compiled artefacts inside the tarball: $shipped"
          if [ "$shipped" -ne 0 ]; then
            echo "::error::compiled artefacts are in the source tarball; see .Rbuildignore"
            tar tzf zuhttp_*.tar.gz | grep -E '\.(o|so|dll|a)$'
            exit 1
          fi
