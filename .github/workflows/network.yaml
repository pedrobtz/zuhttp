# Everything that needs the network or a real TLS backend: the per-backend
# engine suites, the certificate matrix (§50.5), and the R network suite with
# ZU_TEST_NETWORK=1.
#
# Named tls-spike.yaml until W1, after the S0/S1 feasibility spikes it began
# as; the S-numbered job names keep that history.
#
# This is deliberately SEPARATE from R-CMD-check.yaml: it makes real network
# connections, which CRAN checks must never do.

on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "36 6 * * 0"
  pull_request:
  workflow_dispatch:

name: network.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every pull request runs this, including one from a branch of this
# repository (W1). Until then every job here skipped same-repository pull
# requests on the theory that a push run covered them -- but push fires only
# on main, so merges went unchecked. `develop` is gone with it: nothing
# pushes there, and a PR plus a push to the same branch was the double run
# that rule was written against.

jobs:
  # ci.md: a documentation-only pull request skips the jobs below. The gate
  # is r-actions' changes.yml, as in fuzz.yaml; assurance.yml reports a job
  # that is not wired to it.
  changes:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:network'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: network

  # ---------------------------------------------------------------
  # S0 — macOS: OpenSSL engine + SecTrustEvaluateWithError (Keychain)
  # ---------------------------------------------------------------
  # On demand only: the spike's findings are recorded (.agents/history/), and
  # re-running it on every pull request bought a brew install and a matrix
  # whose last step could only ever pass.
  macos-s0:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    name: S0 macOS (engine + Keychain trust)
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenSSL 3
        run: brew install openssl@3

      - name: Environment
        run: |
          sw_vers
          clang --version | head -2
          xcrun --show-sdk-version
          "$(brew --prefix openssl@3)/bin/openssl" version

      - name: Does Secure Transport know TLS 1.3?  (finding F-1)
        run: |
          ST="$(xcrun --show-sdk-path)/System/Library/Frameworks/Security.framework/Headers/SecureTransport.h"
          echo "Searching for kTLSProtocol13 in $ST"
          if grep -q 'kTLSProtocol13' "$ST"; then
            echo "::warning::kTLSProtocol13 FOUND — finding F-1 no longer holds, revisit design 13.2"
          else
            echo "kTLSProtocol13 absent — confirms F-1: Secure Transport fallback is TLS 1.2-only"
          fi

      - name: Run S0 spike matrix
        working-directory: spike/macos-tls
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: |
          make
          ./run.sh

      # Asserts finding F-5 rather than printing it: no continue-on-error,
      # which would turn a changed finding into a green tick (CLAUDE.md). If
      # A starts surviving, D-32's zu_fork_error is worth revisiting.
      - name: Is SecTrust fork-safe?  (finding F-5)
        working-directory: spike/macos-tls
        run: |
          make fork_trust_test
          "$(brew --prefix openssl@3)/bin/openssl" x509 -in tmp/ca.pem -outform DER -out tmp/ca.der
          echo "A. parent uses Security, then forks (expect: child killed):"
          a="$(./fork_trust_test tmp/ca.der 2>&1)"; echo "$a"
          echo
          echo "B. parent does not, then forks (expect: child survives):"
          b="$(./fork_trust_test tmp/ca.der --no-parent-eval 2>&1)"; echo "$b"
          if printf '%s' "$a" | grep -q 'CHILD\] SURVIVED'; then
            echo "::error::F-5 no longer holds: a child forked after SecTrust use survived"
            exit 1
          fi
          if ! printf '%s' "$b" | grep -q 'CHILD\] SURVIVED'; then
            echo "::error::the control failed: a child forked before any SecTrust use did not survive"
            exit 1
          fi

  # ---------------------------------------------------------------
  # S7 — the OpenSSL engine against real endpoints.
  #      Network-dependent by nature, which is why it lives here and not in
  #      c-core.yaml: that suite must stay deterministic and offline.
  # ---------------------------------------------------------------
  tls-engine:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    name: S7 TLS engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # macOS: platforms.yaml
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenSSL
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          else
            brew install openssl@3
          fi

      - name: Build and run the TLS engine tests
        working-directory: ctest
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: make tls

      # #231: the same, under ASan + UBSan. A live backend is code the
      # offline suite cannot reach, and #215 survived uninstrumented.
      - name: The TLS engine tests under ASan + UBSan
        working-directory: ctest
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: make tls-asan

  # ---------------------------------------------------------------
  # S7 preflight — Linux: are the system TLS/zlib dev packages there?
  #      The Linux engine does not exist yet; this checks its premise.
  # ---------------------------------------------------------------
  linux-preflight:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: S7 preflight Linux (system OpenSSL + zlib)
    steps:
      - uses: actions/checkout@v6

      - name: Install declared SystemRequirements
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Versions and default trust paths
        run: |
          openssl version -a
          pkg-config --modversion openssl libssl libcrypto zlib
          echo "OpenSSL default verify paths:"
          openssl version -d

      - name: Compile-and-link probe against system OpenSSL and zlib
        run: |
          cat > preflight.c <<'EOF'
          #include <openssl/ssl.h>
          #include <openssl/x509v3.h>
          #include <zlib.h>
          #include <stdio.h>
          int main(void) {
              printf("OpenSSL headers : %s\n", OPENSSL_VERSION_TEXT);
              printf("OpenSSL runtime : %s\n", OpenSSL_version(OPENSSL_VERSION));
              printf("zlib            : %s\n", zlibVersion());
              SSL_CTX *c = SSL_CTX_new(TLS_client_method());
              if (!c) { printf("SSL_CTX_new FAILED\n"); return 1; }
              /* design 13.5: hostname verification must use the library, never a hand-rolled compare */
              SSL *s = SSL_new(c);
              int ok = SSL_set1_host(s, "example.com");
              printf("SSL_set1_host   : %s\n", ok ? "available" : "FAILED");
              /* design 21.1: gzip auto-detection via inflateInit2(15+32) */
              z_stream z; memset(&z, 0, sizeof z);
              printf("inflateInit2    : %s\n", inflateInit2(&z, 15 + 32) == Z_OK ? "ok (gzip auto-detect)" : "FAILED");
              inflateEnd(&z); SSL_free(s); SSL_CTX_free(c);
              return 0;
          }
          EOF
          sed -i '1i #include <string.h>' preflight.c
          cc -O1 -Wall -o preflight preflight.c $(pkg-config --cflags --libs openssl zlib)
          ./preflight

  # The parts of the C core that need a resolver or a peer, kept OUT of
  # c-core.yaml so that suite stays deterministic and offline.
  net-online:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    name: C core, network-dependent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # macOS: platforms.yaml
    steps:
      - uses: actions/checkout@v6
      - name: Run the suite with the DNS assertions enabled
        timeout-minutes: 5
        working-directory: ctest
        env:
          ZU_TEST_DNS: "1"
        run: make run

  # The §63.2 vertical slice, from R. Network-dependent, so it is here rather
  # than in R-CMD-check.yaml, which must stay deterministic — the same split
  # as c-core.yaml vs the net-online job above.
  slice-r:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    name: 63.2 slice from R (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # macOS: platforms.yaml
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenSSL
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          else
            brew install openssl@3
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::curl

      # §65.8, W20: a local HTTP/2 server whose HTTP/2 is the `h2` package's,
      # not nghttp2's, for test-http2.R's h2c and h2-over-TLS cases. Linux
      # only; every leg also checks h2 against a public host. A server that
      # does not come up fails the step rather than skipping the tests.
      - name: Start the HTTP/2 test server
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/h2venv"
          "$RUNNER_TEMP/h2venv/bin/pip" install --quiet hypercorn
          tools/h2-test-cert.sh "$RUNNER_TEMP/h2"
          nohup "$RUNNER_TEMP/h2venv/bin/python" tools/h2-test-server.py 18080 18443 \
            "$RUNNER_TEMP/h2/cert.pem" "$RUNNER_TEMP/h2/key.pem" \
            > "$RUNNER_TEMP/h2/server.log" 2>&1 &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 18080 && nc -z 127.0.0.1 18443 && break
            sleep 1
          done
          nc -z 127.0.0.1 18080 && nc -z 127.0.0.1 18443 || { cat "$RUNNER_TEMP/h2/server.log"; exit 1; }
          {
            echo "ZU_H2_TEST_SERVER=http://127.0.0.1:18080"
            echo "ZU_H2_TEST_TLS=https://localhost:18443"
            echo "ZU_H2_TEST_CA=$RUNNER_TEMP/h2/ca.pem"
          } >> "$GITHUB_ENV"

      # §65.8, W21: grpc-go's interop server, built at a pinned tag, for
      # test-http2.R's gRPC calls made with zuhttp's own request API. Go is
      # on the Ubuntu image; `go install` rather than Docker, which the
      # design first named, because it needs no image and pins the same tag.
      - name: Start the gRPC interop server
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          go install google.golang.org/grpc/interop/server@v1.67.1
          nohup "$(go env GOPATH)/bin/server" --port 10000 --use_tls=false \
            > "$RUNNER_TEMP/grpc-server.log" 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 10000 && break; sleep 1; done
          nc -z 127.0.0.1 10000 || { cat "$RUNNER_TEMP/grpc-server.log"; exit 1; }
          echo "ZU_GRPC_TEST_SERVER=http://127.0.0.1:10000" >> "$GITHUB_ENV"

      # #240: h11, the reference parser test-h11.R compares zuhttp's
      # HTTP/1.1 response parsing with, pinned. Its venv goes first on the
      # PATH, so the suite's `python3` is the venv's; without h11 that test
      # skips, as it does wherever this step does not run.
      - name: Install h11 for the HTTP/1.1 parser comparison
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/h11venv"
          "$RUNNER_TEMP/h11venv/bin/pip" install --quiet h11==0.16.0
          "$RUNNER_TEMP/h11venv/bin/python" -c "import h11; print(h11.__version__)"
          echo "$RUNNER_TEMP/h11venv/bin" >> "$GITHUB_PATH"

      - name: Install and run the slice
        timeout-minutes: 10
        env:
          ZU_TEST_NETWORK: "1"
          NOT_CRAN: "true"
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: |
          R CMD INSTALL .
          Rscript tools/ci-run-tests.R

  # The same slice at the C level, without R in the picture at all (§11).
  slice-c:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    name: 63.2 slice in C (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # macOS: platforms.yaml
    steps:
      - uses: actions/checkout@v6
      - name: Install OpenSSL
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          else
            brew install openssl@3
          fi
      - name: Build and run
        timeout-minutes: 10
        working-directory: ctest
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: make engine

      - name: The same slice under ASan + UBSan (#231)
        timeout-minutes: 10
        working-directory: ctest
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: make engine-asan

      # D-86, offline: a TLS server that closes without close_notify, and one
      # that sends close_notify behind the body. Both broke the OpenSSL
      # backend at 237bf96 (#99, #100) and passed every other suite. Since
      # #215 also one that renegotiates, and since #249 a forked child that
      # inherits pooled connections, run again under ASan.
      - name: OpenSSL end of stream and pool liveness
        timeout-minutes: 5
        working-directory: ctest
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi
          make tls-eof
          # #215: the renegotiation case is a memory error, visible only
          # under ASan; the same script, against an instrumented driver.
          make tls-eof-asan
